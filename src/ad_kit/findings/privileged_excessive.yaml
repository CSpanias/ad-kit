# ===========================================================================
# PRIVILEGED GROUP FINDINGS
#
# Findings relating to excessive membership of privileged Active Directory
# groups.
#
# These findings identify situations where highly privileged groups contain
# a disproportionate number of members relative to the size of the domain,
# increasing the number of credentials capable of performing
# domain-level administrative actions.
# ===========================================================================

PRIV-001:
  id: PRIV-001

  title: Excessive Membership of Privileged Active Directory Groups

  commentary: |
    A review of privileged Active Directory (AD) group membership identified an 
    excessive proportion of enabled user accounts holding elevated 
    administrative privileges.

    Privileged groups provide extensive access to domain resources, 
    administrative configurations, security settings, and critical 
    infrastructure components. Membership of such groups should be limited to a 
    small number of dedicated administrative accounts with a clearly defined 
    operational requirement.

    The level of privileged access identified suggests that administrative 
    permissions may have been assigned more broadly than necessary. This 
    increases the organisation's attack surface by expanding the number of 
    high-value credentials available to an attacker.

    Excessive privileged group membership is commonly indicative of weaknesses 
    in access governance and adherence to the Principle of Least Privilege 
    (PoLP). Over time, elevated permissions may be retained for convenience, 
    historical reasons, or temporary operational requirements, resulting in 
    unnecessary access persisting long after the original business need has 
    ceased.

    In the event of credential theft through phishing, malware, password 
    spraying, credential reuse, or other attack techniques, compromise of any 
    privileged account may provide an attacker with immediate access to 
    critical systems and services across the estate.

    This may facilitate privilege escalation, lateral movement, unauthorised 
    access to sensitive information, disruption of business operations, and 
    ultimately compromise of the wider Active Directory environment.

  remediation: |
    To reduce the risks associated with excessive privileged access, the
    following actions are recommended:

    - Conduct a comprehensive review of privileged Active Directory groups and 
      confirm that all membership assignments remain operationally necessary 
      and appropriately authorised.
    - Membership of highly privileged groups should be restricted to a small 
      number of dedicated administrative accounts with a clearly defined 
      business requirement.
    - Unnecessary, duplicate, shared, legacy, dormant, and inactive privileged 
      accounts should be removed from privileged groups and disabled where 
      appropriate.
    - Administrative personnel should utilise separate dedicated accounts for 
      privileged activities. These accounts should be distinct from standard 
      user accounts used for email, web browsing, and day-to-day productivity 
      tasks.
    - Implement a tiered administrative model in which privileged permissions 
      are used only when required to perform administrative functions and are 
      not assigned to standard user accounts.
    - Where elevated permissions are required, delegated administration should 
      be implemented wherever possible in preference to broad domain-level 
      privileges.
    - Establish a formal process for periodic review and recertification of 
      privileged access to ensure administrative permissions remain necessary, 
      appropriate, and aligned with current job responsibilities.
    - Consider implementing additional protections for highly privileged 
      accounts, including multi-factor authentication (MFA), Privileged Access 
      Workstations (PAWs), enhanced monitoring, and Privileged Access 
      Management (PAM) solutions where appropriate.

  references:
    - https://nist-sp-800-53-r5.bsafes.com/docs/3-1-access-control/ac-6-least-privilege/
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory#avoid-granting-excessive-privileges

PRIV-002:
  id: PRIV-002

  title: Large Population of Accounts Marked as Protected

  commentary: |
    A large proportion of domain accounts were returned by the `adminCount=1`
    query. This attribute is associated with accounts protected by privileged
    group protections, but it can remain set after an account is no longer a
    member of a protected group. It is not, by itself, proof of current
    administrative access.

    A large population can indicate that privileged access or account
    protection has been assigned more broadly than intended, or that stale
    `adminCount` values have not been reviewed.

  remediation: |
    Review each account with `adminCount=1` against current privileged group
    membership and the organisation's administrative model. Remove unnecessary
    privileged group membership and investigate stale attribute values through
    the normal Active Directory administration process.

  references:
    - https://learn.microsoft.com/en-us/windows/win32/adschema/a-admincount
    - https://www.techtarget.com/news/Learn-to-adjust-the-AdminCount-attribute-in-protected-accounts/861519/

PRIV-003:
  id: PRIV-003

  title: Built-in Guest Account Enabled

  commentary: |
    The built-in Guest account was enabled. Although it has limited default
    permissions, it is a shared, well-known identity with a well-known SID.
    Depending on its password and the surrounding access-control settings,
    enabling it can allow access without an individually authenticated account
    and make activity harder to attribute. Keep it disabled unless there is a
    documented business need.

  remediation: |
    Set the `Accounts: Guest account status` policy to Disabled unless a
    documented business need requires Guest access. Before changing the
    setting, review the `Network access: Sharing and security model for local
    accounts` policy: when it is set to Guest only, disabling Guest can cause
    SMB and other network logons to fail.

    If Guest access is temporarily required, use a strong password, limit its
    permissions and exposure, and monitor its activity. Avoid using it on
    systems with external network access or access to other computers. Disable
    the account and change or remove its password when the need ends.

  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-default-user-accounts#guest-account
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/accounts-guest-account-status
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-access-sharing-and-security-model-for-local-accounts

PRIV-004:
  id: PRIV-004

  title: Built-in Administrator Account Enabled

  commentary: |
    The built-in Administrator account was enabled. This is a well-known,
    high-privilege account that can be renamed or disabled but cannot be
    deleted or locked out. On a Domain Controller, it provides extensive
    domain-level administrative access.

    An enabled status alone does not establish a security misconfiguration;
    the account may be required for administration or recovery. It is
    included as an informational observation because compromise of this
    account could have significant impact.

  remediation: |
    Ensure the account has a long, unique password and protect its use with
    appropriate administrative logon controls and monitoring. Consider
    renaming or disabling it only when operational and recovery requirements
    have been reviewed. On Domain Controllers, disabling the account does not
    remove every recovery-mode access path, so it should not replace strong
    credential protection.

  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-default-user-accounts#administrator-account

PRIV-005:
  id: PRIV-005

  title: Unexpected DCSync-Related Replication Rights

  commentary: |
    One or more non-default principals were granted DCSync-related replication
    control rights on the domain naming context. A principal with both
    Replicating Directory Changes and Replicating Directory Changes All can
    replicate sensitive directory data, including credential material.
    Replicating Directory Changes In Filtered Set is an additional right for
    filtered attributes.

    Some reported principals may have only a subset of the core rights; this
    does not by itself confirm that they can perform a complete DCSync
    operation. Review the trustee's direct and group-derived permissions.

  remediation: |
    Review each identified trustee and remove replication rights that are not
    required for an approved directory replication service. Preserve the
    permissions required by Domain Controllers and other documented default
    administrative principals. Also review nested group membership and
    inherited permissions when validating effective access.

  references:
    - https://www.alteredsecurity.com/post/a-primer-on-dcsync-attack-and-detection
    - https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes
    - https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes-all
    - https://learn.microsoft.com/en-us/windows/win32/adschema/r-ds-replication-get-changes-in-filtered-set
# ===========================================================================
# AS-REP ROASTING FINDINGS
#
# Findings relating to Active Directory accounts configured without Kerberos 
# pre-authentication.
#
# These findings identify accounts susceptible to AS-REP roasting attacks,
# enabling attackers to obtain Kerberos authentication material and perform
# offline password cracking without prior authentication.
# ===========================================================================

ASREP-001:
  id: ASREP-001

  title: Accounts Susceptible to AS-REP Roasting

  commentary: |
    A review of Active Directory (AD) account configurations identified
    {count} user {subject} configured without Kerberos pre-authentication.

    Accounts configured with the setting 'Do not require Kerberos 
    pre-authentication' are susceptible to AS-REP roasting attacks.

    An attacker may request Kerberos Authentication Service Responses (AS-REPs) 
    from the Key Distribution Centre (KDC) without first providing valid 
    credentials for the affected account.

    The returned AS-REP response contains password-derived cryptographic 
    material that can be subjected to offline brute-force and dictionary 
    attacks without generating additional authentication attempts against 
    Active Directory.

    Because password cracking is performed offline, the attack generates 
    minimal authentication activity and may be difficult to detect through
    conventional monitoring of authentication events.

    Successful recovery of affected account passwords may provide an attacker 
    with valid domain credentials, facilitating unauthorised access to 
    corporate resources, domain enumeration, privilege escalation, and lateral
    movement.

    Whilst exposure of AS-REP responses enables offline password attacks, the 
    primary factor determining exploitability is password strength. Weak 
    passwords significantly increase the likelihood of successful credential 
    recovery.

  remediation: |
    To reduce the risk of unauthorised access arising from accounts susceptible 
    to AS-REP roasting attacks, the following actions are recommended:

    - Identify all accounts configured without Kerberos pre-authentication and 
      determine whether the setting remains operationally necessary.
    - Enable Kerberos pre-authentication for affected accounts wherever 
      possible to prevent retrieval of AS-REP responses without prior 
      authentication.
    - Enforce strong password policies requiring unique and sufficiently 
      complex passwords, particularly for privileged, administrative, service, 
      and legacy accounts.
    - Implement Multi-Factor Authentication (MFA) for privileged accounts to 
      reduce the impact of potential credential compromise.
    - Periodically review account configurations to identify accounts that do 
      not require Kerberos pre-authentication and remove unnecessary exceptions.
    - Monitor Kerberos authentication activity for unusual AS-REQ and AS-REP 
      activity and investigate unexpected requests involving privileged or 
      sensitive accounts.
    - Legacy applications requiring disabled pre-authentication should be 
      reviewed and remediated where operationally feasible.

  references:
    - https://attack.mitre.org/techniques/T1558/004/
    - https://www.thehacker.recipes/ad/movement/kerberos/asreproast
    - https://itpeoplenetwork.com/blog/itsecurity/Understanding-AS-REP-Roasting-Threat-Analysis-and-Prevention-Strategies.html

ASREP-002:
  id: ASREP-002

  title: Privileged Accounts Susceptible to AS-REP Roasting

  commentary: |
    A total of {count} {subject} configured without Kerberos pre-authentication {was}
    also identified as members of a monitored privileged Active Directory
    group.

    This combination increases the potential impact of AS-REP roasting:
    authentication material may be obtained without authenticating as the
    affected account, and a recovered password could provide access to
    permissions assigned through the account's group memberships. Membership
    in a monitored group does not necessarily mean the account has domain-wide
    administrative rights; the effective permissions should be reviewed.

  remediation: |
    In addition to addressing the AS-REP roasting exposure, review the affected
    accounts' group memberships and effective permissions.

    - Enable Kerberos pre-authentication for each account wherever possible.
    - Remove unnecessary privileged group memberships and apply least
      privilege, while validating operational requirements before making
      changes.
    - Ensure affected accounts use strong, unique passwords and appropriate
      credential-management controls.
    - Review service accounts for migration to Group Managed Service Accounts
      (gMSAs) where supported.
    - Investigate suspected credential compromise and reset affected
      credentials promptly.

  references:
    - https://attack.mitre.org/techniques/T1558/004/
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/useraccountcontrol-manipulate-account-properties
# ===========================================================================
# LDAP INFORMATION EXPOSURE
# ===========================================================================

LDAPINFO-001:
  id: LDAPINFO-001
  title: Sensitive Information Stored in LDAP Attributes

  commentary: |
    The assessment identified potentially sensitive information or
    password-related values in LDAP attributes accessible to the account used
    for the check. Such information may assist with credential discovery,
    further enumeration or compromise.

    The following attributes require review:

  remediation: |
    Review the identified attribute values and their operational purpose before
    making changes. Establish guidance on appropriate attribute use and review
    attributes periodically. The following actions are also recommended:

  settings:
    description:
      commentary: "The `description` attribute contained values matching sensitive keywords. These matches require review and do not necessarily contain secrets."
      remediation: "Review the flagged `description` values and remove credentials and other sensitive information that should not be stored there."
      references:
        - https://attack.mitre.org/techniques/T1087/
    info:
      commentary: "The `info` attribute contained values matching sensitive keywords. These matches require review and do not necessarily contain secrets."
      remediation: "Review the flagged `info` values and remove credentials and other sensitive information that should not be stored there."
      references:
        - https://attack.mitre.org/techniques/T1087/
    userPassword:
      commentary: "Values were returned from the `userPassword` attribute. They may contain password material or hashes, but their presence does not establish that they are usable credentials."
      remediation: "Investigate the returned `userPassword` values, their access permissions, and any application dependencies. Remove unnecessary data and rotate exposed credentials where appropriate."
      references:
        - https://attack.mitre.org/techniques/T1552/001/
        - https://learn.microsoft.com/en-us/windows/win32/adsi/security-descriptors-on-directory-objects
    unixUserPassword:
      commentary: "Values were returned from the `unixUserPassword` attribute. They may contain password material or hashes, but their presence does not establish that they are usable credentials."
      remediation: "Investigate the returned `unixUserPassword` values, their access permissions, and any application dependencies. Remove unnecessary data and rotate exposed credentials where appropriate."
      references:
        - https://attack.mitre.org/techniques/T1552/001/
        - https://learn.microsoft.com/en-us/windows/win32/adsi/security-descriptors-on-directory-objects

# ==============================================================================
# Deleted Active Directory Objects
# ==============================================================================

TOMB-001:
  id: TOMB-001
  title: Deleted AD Objects Readable by Standard User

  commentary: |
    The Standard User was able to enumerate objects in the Active Directory (AD)
    Deleted Objects container on {count} {subject}. Deleted objects may retain
    directory attributes that disclose information about the environment.

    This finding is based on a read-only query. No objects were restored or
    modified.

  remediation: |
    Review the permissions on the Deleted Objects container and restrict
    read access to authorized administrative roles. Confirm that delegated
    permissions do not grant unnecessary access to deleted directory data.

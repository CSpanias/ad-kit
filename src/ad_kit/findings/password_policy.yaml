# ==============================================================================
# Password Policy Findings
#
# This file contains finding definitions relating to Active Directory password 
# and account lockout policy controls.
#
# Findings defined in this file are intended to identify weaknesses that may 
# increase the likelihood of password guessing, password spraying, brute-force 
# attacks, and unauthorised access to domain accounts.
# ==============================================================================

PASS-001:
  id: PASS-001

  title: Weak Password and Account Lockout Policy

  commentary: |
    Password and account lockout policies govern how credentials are selected
    and how repeated authentication failures are handled. Weak settings can
    increase exposure to password guessing or allow users to reuse passwords
    sooner than intended. Their impact depends on the accounts affected and
    the other controls in place.

  remediation: |
    Review the following settings against organisational requirements and the
    controls in place:

  settings:
    minimum_length:
      commentary: "Minimum password length was {value} {character_word}; short passwords are generally more susceptible to guessing."
      remediation: "Increase the minimum password length to at least 12 characters, and consider longer passwords for privileged accounts."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/minimum-password-length
        - https://www.ncsc.gov.uk/collection/passwords/updating-your-approach
    password_history:
      commentary: "Password history retained {value} previous {password_word}, which may allow recently used passwords to be reused."
      remediation: "Increase password history to prevent the reuse of recently used passwords, accounting for the minimum password age."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/enforce-password-history
    minimum_age:
      commentary: "Minimum password age was {value}, which may allow rapid password cycling to bypass password history."
      remediation: "Review the minimum password age and set an appropriate delay to support password history while allowing necessary resets."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/minimum-password-age
    complexity:
      commentary: "The built-in password complexity requirement was {value}; assess whether other controls prevent commonly guessed passwords."
      remediation: "Review password selection controls, including length and password blocklists; do not rely on composition rules alone."
      references:
        - https://www.ncsc.gov.uk/collection/passwords/updating-your-approach
        - https://pages.nist.gov/800-63-4/sp800-63b/authenticators/#passwordver
    reversible_encryption:
      commentary: "Reversible password encryption was enabled, allowing affected passwords to be stored in a recoverable form."
      remediation: "Disable reversible password encryption unless explicitly required; review dependencies and plan password resets for affected accounts."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption
    observation_window:
      commentary: "The lockout observation window was {value}, which may allow failed attempts to be reset quickly."
      remediation: "Review the lockout observation window together with the threshold and duration, balancing guessing resistance and availability."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/reset-account-lockout-counter-after
    lockout_duration:
      commentary: "The account lockout duration was {value}, which may allow repeated guessing attempts to resume sooner."
      remediation: "Review the lockout duration alongside the threshold and observation window, balancing security and operational impact."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/account-lockout-duration
    lockout_threshold:
      commentary: "The account lockout threshold was {value} failed attempts, allowing a high number of attempts before an account is locked."
      remediation: "Review the lockout threshold and supporting monitoring to limit repeated guessing while accounting for lockout denial-of-service risk."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/account-lockout-threshold
    lockout_disabled:
      commentary: "The account lockout threshold was {value}, disabling account lockout for failed authentication attempts."
      remediation: "Consider enabling account lockout or equivalent controls against repeated guessing, balancing protection against lockout denial-of-service risk."
      references:
        - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/account-lockout-threshold

PASS-002:
  id: PASS-002

  title: Accounts Configured Without a Required Password

  commentary: |
    The assessment identified {count} {subject} with the
    `PASSWD_NOTREQD` flag set in the `userAccountControl` attribute.

    This flag indicates that Active Directory does not require the account to
    have a password. Its presence does not prove that the account currently has
    a blank password, nor does it establish that an existing password bypasses
    the domain password policy. However, it permits the account to exist
    without a password where the domain configuration allows, weakening the
    assurance that the account is protected by password-based authentication.

    Review each affected account to confirm its type, purpose, password state,
    and whether this setting is operationally required. Trust and other
    non-human accounts may use this flag for specific directory functions and
    should not be changed without assessing the impact.

  remediation: |
    Review all accounts with `PASSWD_NOTREQD` enabled and remove the flag from
    accounts that do not have a documented requirement for it.

    The following actions are recommended:

    - Confirm the account type and business purpose before changing the flag,
      particularly for trust, computer, and service accounts.
    - For ordinary user accounts where the setting is not required, clear the
      flag and ensure a strong password is configured in accordance with
      organisational policy.
    - Review service accounts and consider migrating suitable workloads to
      Group Managed Service Accounts (gMSAs) for managed password rotation.
    - Periodically monitor for newly created or modified accounts with this
      flag enabled.

    For a user account, the flag can be cleared with PowerShell:

    `Set-ADUser -Identity <username> -PasswordNotRequired $false`

  references:
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/useraccountcontrol-manipulate-account-properties
    - https://ldapwiki.com/wiki/Wiki.jsp?page=PASSWD_NOTREQD
    - https://specopssoft.com/blog/find-ad-accounts-using-password-not-required-blank-password/

PASS-003:
  id: PASS-003

  title: Accounts Configured with Non-Expiring Passwords

  commentary: |
    The assessment identified {count} {subject} with the
    `DONT_EXPIRE_PASSWD` flag set in the `userAccountControl` attribute.

    This setting exempts an account's password from normal password expiration
    requirements. It does not by itself indicate that a password is weak or
    compromised, but a password that is not changed can remain valid for
    longer, increasing the period of exposure if it is disclosed.

    Review each affected account to confirm its type, purpose, password
    management process, and whether the setting is justified. Service accounts
    may have operational requirements, but should use managed credentials
    where practical.

  remediation: |
    Review accounts with non-expiring passwords and remove the setting where
    it is not supported by a documented operational requirement.

    The following actions are recommended:

    - Confirm the account owner, purpose, and authentication dependencies
      before changing the setting.
    - For user accounts where password expiration is required by
      organisational policy, clear the non-expiring setting and ensure the
      account uses a strong, unique password.
    - Prefer Group Managed Service Accounts (gMSAs) for supported services.
      For other service accounts, use an approved secret-management process
      and rotate credentials according to risk and organisational policy.
    - Document justified exceptions and periodically review them.
    - Reset credentials promptly if compromise is suspected.

    For a user account, the setting can be cleared with PowerShell:

    - `Set-ADUser -Identity <username> -PasswordNeverExpires $false`

  references:
    - https://ldapwiki.com/wiki/Wiki.jsp?page=DONT_EXPIRE_PASSWORD
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/useraccountcontrol-manipulate-account-properties
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview
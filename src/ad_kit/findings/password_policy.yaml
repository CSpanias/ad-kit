# ==============================================================================
# Password Policy Findings
#
# This file contains finding definitions relating to Active Directory password 
# and account lockout policy controls.
#
# Findings defined in this file are intended to identify weaknesses that may 
# increase the likelihood of password guessing, password spraying, brute-force 
# attacks, and unauthorised access to domain accounts.
# ==============================================================================

PASS-001:
  id: PASS-001
  title: Weak Password Policy

  commentary: |
    The assessment identified one or more weaknesses within the Active 
    Directory password policy.

    Password policy controls are intended to reduce the likelihood of 
    successful password guessing attacks, password spraying, credential 
    stuffing, and credential compromise.

    Weak password requirements may allow users to select passwords that are 
    more susceptible to guessing or brute-force attacks, increasing the risk of 
    unauthorised access to domain resources.

  remediation: |
    Review and strengthen the Active Directory password policy to align with 
    organisational security requirements and current best practice.

    Password length, password history, password complexity, and password age 
    settings should be reviewed and updated where necessary.

    Any proposed changes should be tested prior to implementation and 
    communicated to affected users.

  references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/password-policy
    - https://www.ncsc.gov.uk/collection/passwords/updating-your-approach


PASS-002:
  id: PASS-002
  title: Weak Account Lockout Policy

  commentary: |
    The assessment identified one or more weaknesses within the Active 
    Directory account lockout policy.

    Account lockout controls help reduce the effectiveness of password spraying 
    and brute-force attacks by limiting the number of failed authentication 
    attempts permitted within a given period.

    Insufficient lockout protection may increase the likelihood of successful 
    credential guessing attacks against domain accounts.

  remediation: |
    Review and strengthen account lockout controls across the domain.

    Lockout thresholds, lockout durations, and observation windows should be 
    configured to provide an appropriate balance between security and 
    operational requirements.

    Any proposed changes should be tested prior to implementation to minimise 
    disruption to users and services.

  references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-lockout-policy
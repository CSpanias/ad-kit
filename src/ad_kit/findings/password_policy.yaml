# ==============================================================================
# Password Policy Findings
#
# This file contains finding definitions relating to Active Directory password 
# and account lockout policy controls.
#
# Findings defined in this file are intended to identify weaknesses that may 
# increase the likelihood of password guessing, password spraying, brute-force 
# attacks, and unauthorised access to domain accounts.
# ==============================================================================

PASS-001:
  id: PASS-001

  title: Weak Password and Account Lockout Policy

  commentary: |
    Password and account lockout controls are intended to reduce the
    likelihood of successful password guessing attacks, password spraying,
    credential stuffing, brute-force attacks, and unauthorised access to
    domain accounts.

    Weak password requirements and ineffective account lockout controls may
    increase the likelihood of credential compromise and facilitate
    unauthorised access to domain resources.

  remediation: |
    Review and strengthen the Active Directory password and account lockout
    policy to align with organisational security requirements and current
    best practice.

    The following controls should be reviewed and updated where necessary:

    - Configure a minimum password length of at least 12 characters and
      consider requiring 15 or more characters for administrative and
      privileged accounts.
    - Enforce password history to prevent the reuse of recently used passwords.
    - Enable password complexity requirements to reduce the likelihood of weak 
      or easily guessable passwords being selected.
    - Configure a minimum password age to prevent password cycling and reduce 
      the likelihood of users circumventing password history controls.
    - Configure an account lockout threshold to limit the effectiveness of
      password spraying and brute-force attacks.
    - Configure an account lockout duration that balances security and
      operational requirements. Administrative accounts should require manual 
      intervention wherever practical, whilst standard user accounts may be 
      configured with an automatic unlock period.
    - Configure an account lockout observation window that provides effective 
      protection against repeated authentication attempts while minimising 
      operational impact to legitimate users.

    Any proposed changes should be tested prior to implementation and
    communicated to affected users and service owners.

  references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/password-policy
    - https://www.ncsc.gov.uk/collection/passwords/updating-your-approach
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-lockout-policy
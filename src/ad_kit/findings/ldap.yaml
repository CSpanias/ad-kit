# ==============================================================================
# LDAP Configuration Findings
#
# This file contains finding definitions relating to LDAP security controls
# within Active Directory environments, including LDAP signing, LDAP channel
#  binding, and anonymous LDAP bind configuration.
#
# Findings defined in this file are intended to identify weaknesses that may 
# enable credential relay, authentication tampering, unauthorised directory 
# enumeration, or other attacks against Active Directory services.
# ==============================================================================

LDAP-001:
  id: LDAP-001
  title: LDAP Signing Not Enforced

  commentary: |
    The assessment identified that one or more Domain Controllers did not
    enforce Lightweight Directory Access Protocol (LDAP) signing. As a result, 
    LDAP communications may occur without integrity protection and are 
    susceptible to tampering and relay attacks.

    LDAP signing ensures that LDAP traffic is cryptographically signed, 
    allowing clients and servers to verify the integrity and authenticity of 
    directory communications.

    Without LDAP signing, an attacker positioned on the network may be able to 
    intercept LDAP traffic, modify data in transit, or relay authentication 
    requests in order to authenticate as legitimate users.

    Successful exploitation could allow an attacker to manipulate LDAP queries, 
    forge directory responses, and gain unauthorised access to systems or 
    resources based on falsified Active Directory information.

  remediation: |
    Enforce LDAP signing across all Domain Controllers to prevent 
    authentication tampering and credential relay attacks.

    Prior to implementation, testing should be performed to identify and 
    address any compatibility issues affecting legacy applications, services, 
    or devices that rely on LDAP communications.

  references:
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/identity/enable-ldap-signing-in-windows-server
    - https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/active-directory-hardening-series---part-3-–-enforcing-ldap-signing/4066233


LDAP-002:
  id: LDAP-002
  title: LDAP Channel Binding Not Required

  commentary: |
    The assessment identified that one or more Domain Controllers (DCs) did not 
    require LDAP channel binding.

    LDAP channel binding associates authentication credentials with the 
    specific Transport Layer Security (TLS) session over which authentication 
    occurs, helping to prevent credential relay attacks.

    Without channel binding, an attacker in an Adversary-in-the-Middle (AitM) 
    position may be able to intercept authentication requests sent over a 
    secure connection and relay them to a DC over a separate session.

    Because the DC does not verify that the authentication request is bound to 
    the original secure channel, the relayed authentication may be accepted as 
    legitimate.

    Enforcing LDAP channel binding significantly reduces the risk of credential 
    relay attacks against Active Directory services.

  remediation: |
    Configure LDAP channel binding to be enforced across all Domain Controllers 
    to reduce the risk of credential relay attacks.

    Where possible, the setting should be configured as 'Always'. If 
    compatibility constraints exist, 'When Supported' may be used as an interim 
    measure while dependent systems are remediated.

    Prior to implementation, testing should be performed to identify and 
    address any compatibility issues affecting legacy applications, services, 
    or devices.

  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/ldap-signing#how-ldap-channel-binding-works
    - https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/active-directory-hardening-series---part-5-–-enforcing-ldap-channel-binding/4235497
    - https://support.microsoft.com/en-us/topic/kb4034879-use-the-ldapenforcechannelbinding-registry-entry-to-make-ldap-authentication-over-ssl-tls-more-secure-e9ecfa27-5e57-8519-6ba3-d2c06b21812e


LDAP-003:
  id: LDAP-003
  title: Anonymous LDAP Bind Permitted

  commentary: |
    The assessment identified that one or more Domain Controllers permitted 
    anonymous LDAP bind operations.

    Anonymous binds allow unauthenticated users to query directory information 
    without providing valid credentials.

    Depending on the directory configuration, this may allow attackers to 
    enumerate users, groups, domain information, and other directory objects 
    which can assist with reconnaissance and attack planning.

    Directory services should require authentication for LDAP queries wherever 
    possible to limit unauthorised access to Active Directory information.

  remediation: |
    Disable anonymous LDAP bind operations and require authentication for 
    directory queries.

    Review any systems, applications, or network appliances that utilise LDAP 
    to ensure authenticated connections are used where required.

    Prior to implementation, testing should be performed to identify and 
    address any compatibility issues affecting legacy systems or third-party 
    integrations.

  references:
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/anonymous-ldap-operations-active-directory-disabled
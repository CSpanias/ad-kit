# ==============================================================================
# LDAP Configuration Findings
#
# This file contains finding definitions relating to LDAP security controls
# within Active Directory environments, including LDAP signing, LDAP channel
#  binding, and anonymous LDAP bind configuration.
#
# Findings defined in this file are intended to identify weaknesses that may 
# enable credential relay, authentication tampering, unauthorised directory 
# enumeration, or other attacks against Active Directory services.
# ==============================================================================

LDAP-001:
  id: LDAP-001
  title: LDAP Signing Not Enforced

  commentary: |
    Lightweight Directory Access Protocol (LDAP) is used to authenticate
    clients and access directory information in Active Directory environments.
    LDAP signing protects the integrity of supported LDAP communications by
    allowing clients and servers to detect changes to messages in transit.
    Signing does not encrypt the contents of those messages.

    A domain controller that does not require signing can accept unsigned
    authenticated binds and simple binds over unencrypted connections. An
    attacker positioned on the network may be able to tamper with unsigned
    traffic or relay another user's authentication to the directory service.
    Depending on the account's privileges and other security controls,
    successful exploitation could lead to unauthorised access or changes to
    directory information. The setting does not establish that all LDAP
    traffic is unsigned or that an attack has occurred.

    During the assessment, {count} {subject} did not require LDAP signing.

  remediation: |
    Require Lightweight Directory Access Protocol (LDAP) signing on affected
    domain controllers and, where appropriate, across the environment:

    - Identify applications, services, and devices that use unsigned LDAP
      binds or unencrypted simple binds, and assess their compatibility.
    - Update clients to use signed authentication or appropriately secured
      LDAP connections before enforcing the setting.
    - Configure domain controllers to require LDAP signing, using Group
      Policy where appropriate.
    - Validate the effective configuration and test dependent services after
      changes. Review directory service events to identify remaining
      incompatible clients.

  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/ldap-signing
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/identity/enable-ldap-signing-in-windows-server
    - https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/active-directory-hardening-series---part-3-–-enforcing-ldap-signing/4066233


LDAP-002:
  id: LDAP-002
  title: LDAP Channel Binding Not Enforced

  commentary: |
    Lightweight Directory Access Protocol (LDAP) channel binding links
    supported authentication attempts to the specific Transport Layer Security
    (TLS) connection over which they occur. This helps a domain controller
    distinguish an authentication attempt made over the original secure
    connection from one relayed over a different connection.

    When channel binding is not enforced, an attacker who can obtain or
    intercept suitable authentication may be able to relay it to an LDAP
    service over TLS. Depending on the account's privileges and other security
    controls, successful relay could lead to unauthorised access or changes
    to directory information. The setting alone does not establish that relay
    has occurred or that a particular attack will succeed.

    During the assessment, LDAP channel binding was not enforced on {count}
    {subject}.

  remediation: |
    Enforce Lightweight Directory Access Protocol (LDAP) channel binding on
    affected domain controllers and, where appropriate, across the environment:

    - Identify applications, services, and devices that use LDAP over Transport
      Layer Security (TLS), and assess their support for channel binding.
    - Update or replace incompatible clients and test dependent services
      before enforcing channel binding.
    - Configure the domain controller channel binding policy as `Always` where
      supported. Use `When Supported` only as an interim measure where
      compatibility requires it; it does not require all clients to provide
      channel binding.
    - Verify the effective configuration and review directory service events
      for incompatible clients after changes.

  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/ldap-signing#how-ldap-channel-binding-works
    - https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/active-directory-hardening-series---part-5-–-enforcing-ldap-channel-binding/4235497
    - https://support.microsoft.com/en-us/topic/kb4034879-use-the-ldapenforcechannelbinding-registry-entry-to-make-ldap-authentication-over-ssl-tls-more-secure-e9ecfa27-5e57-8519-6ba3-d2c06b21812e


LDAP-003:
  id: LDAP-003
  title: Anonymous LDAP Bind Permitted

  commentary: |
    An anonymous Lightweight Directory Access Protocol (LDAP) bind establishes
    a connection without an authenticated user identity. Such connections can
    have legitimate uses, and the information available to them depends on
    directory configuration and permissions.

    Where anonymous directory searches are permitted, an unauthenticated user
    may be able to enumerate accounts, groups, or other objects. This
    information could reveal naming conventions and potential targets for
    further attacks. A successful anonymous bind alone does not establish that
    directory searches or user enumeration are permitted; these require
    separate verification.

    During the assessment, {count} {subject} permitted anonymous LDAP binds.

  remediation: |
    Restrict anonymous Lightweight Directory Access Protocol (LDAP) access to
    the minimum required by documented operational needs:

    - Review anonymous directory permissions and restrict unnecessary access
      to directory objects and searches.
    - Require authenticated connections for directory queries where
      appropriate, while retaining any necessary limited anonymous discovery.
    - Identify applications, services, and devices that rely on anonymous
      access, and test compatibility before changing permissions.
    - Re-test anonymous searches and dependent services after remediation to
      confirm that access is appropriately restricted.

  references:
    - https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/anonymous-ldap-operations-active-directory-disabled
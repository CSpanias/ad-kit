site_name: ad-kit
site_description: Active Directory Assessment Toolkit documentation
site_author: Charalampos Spanias
site_url: https://cspanias.github.io/ad-kit/
repo_url: https://github.com/CSpanias/ad-kit
edit_uri: blob/main/docs/
strict: true

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Installation: installation.md
  - Workflow: workflow.md
  - Commands:
    - Tools: commands/tools.md
    - Enum: commands/enum.md
    - Check: commands/check.md
  - Checks:
    - LDAP: checks/ldap.md
    - SMB: checks/smb.md
    - AS-REP Roasting: checks/asreproast.md
    - Kerberoasting: checks/kerberoast.md
    - AD CS: checks/adcs.md
    - NoPAC: checks/nopac.md
    - DNS: checks/dns.md
    - Pre-Windows 2000: checks/pre2k.md
    - Script Path: checks/scriptpath.md
    - Privileged Groups: checks/privileged.md
    - Delegation: checks/delegation.md
    - Password Policy: checks/pass-pol.md
    - Password Not Required: checks/password-not-required.md
    - Password Never Expires: checks/password-never-expires.md
    - Machine Account Quota: checks/maq.md
    - Tombstone: checks/tombstone.md
    - Local Administrator: checks/local-admin.md
    - LDAP Info Exposure: checks/ldap-info.md
    - Authentication Coercion: checks/coercion.md
  - Findings: findings/index.md
  - Artefacts: artefacts.md
  - Releasing: releasing.md
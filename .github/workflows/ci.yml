name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra docs
      - run: uv run --no-sync pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra docs
      - run: uv run --no-sync ruff check src tests --ignore E501
      - run: >-
          uv run --no-sync mypy --follow-imports=silent
          src/ad_kit/core/finding.py
          src/ad_kit/reporting/json.py
          src/ad_kit/reporting/sureformat.py
      - run: uv run --no-sync mkdocs build
      - run: uv build
      - run: |
          python - <<'PY'
          import glob
          import tarfile
          allowed = {".gitignore", "src", "tests", "docs", "README.md", "CHANGELOG.md",
                     "LICENSE", "mkdocs.yml", "pyproject.toml", "uv.lock", "PKG-INFO"}
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              roots = {name.split("/")[1] for name in archive.getnames() if "/" in name}
          unexpected = roots - allowed
          if unexpected:
              raise SystemExit(f"Unexpected source distribution contents: {sorted(unexpected)}")
          PY
          uv venv .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/ad-kit --version
          .release-smoke/bin/ad-kit --help
          .release-smoke/bin/python -c "from ad_kit.core.findings import load_finding; print(load_finding('ldap', 'LDAP-001').title)"

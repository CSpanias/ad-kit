[project]
name = "ad-kit"
version = "0.1.0"
description = "Active Directory Pentest Toolkit Manager"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Charalampos Spanias" }
]

dependencies = [
    "typer>=0.16.0",
    "rich>=14.0.0",
    "pyyaml>=6.0.2",
    "questionary>=2.1.0",
    "requests>=2.32.0",
]

[project.scripts]
ad-kit = "ad_kit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_kit"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true